<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">⚙️ 하네스(Harness) 9 부품 — *AI가 스스로 일을 잘 하게 하는* 구조</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#64748b">출처: Boris Cherny (Claude Code Creator) 인터뷰 4종 + Claude Code 공식 문서 종합</text>

  <!-- 9 boxes in a curved flow -->
  <!-- Row 1: 1,2,3,4,5 -->
  <g font-size="12" font-weight="700">
    <!-- 1. 입력 큐 -->
    <rect x="30" y="100" width="200" height="120" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="130" y="125" text-anchor="middle" font-size="14" fill="#78350f">① 입력 큐</text>
    <text x="130" y="148" text-anchor="middle" font-size="11" fill="#78350f">Input Queue</text>
    <line x1="55" y1="158" x2="205" y2="158" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="130" y="175" text-anchor="middle" font-size="10" font-weight="400" fill="#451a03">칸반·issue·텔레그램·</text>
    <text x="130" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#451a03">cron·CI webhook</text>
    <text x="130" y="208" text-anchor="middle" font-size="9" font-weight="400" font-style="italic" fill="#78350f">"누가 일을 시작시키는가?"</text>

    <!-- arrow -->
    <line x1="230" y1="160" x2="265" y2="160" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr2)"/>

    <!-- 2. 작업 분해기 -->
    <rect x="265" y="100" width="200" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="365" y="125" text-anchor="middle" font-size="14" fill="#1e3a8a">② 작업 분해기</text>
    <text x="365" y="148" text-anchor="middle" font-size="11" fill="#1e3a8a">Task Decomposer</text>
    <line x1="290" y1="158" x2="440" y2="158" stroke="#2563eb" stroke-width="0.5"/>
    <text x="365" y="175" text-anchor="middle" font-size="10" font-weight="400" fill="#1e3a8a">큰 요청 → 작은 task</text>
    <text x="365" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#1e3a8a">+ 완료 조건 명시</text>
    <text x="365" y="208" text-anchor="middle" font-size="9" font-weight="400" font-style="italic" fill="#1e3a8a">"완료 조건 없으면 task 아님"</text>

    <line x1="465" y1="160" x2="500" y2="160" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr2)"/>

    <!-- 3. 컨텍스트 로더 -->
    <rect x="500" y="100" width="200" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="600" y="125" text-anchor="middle" font-size="14" fill="#14532d">③ 컨텍스트 로더</text>
    <text x="600" y="148" text-anchor="middle" font-size="11" fill="#14532d">Context Loader</text>
    <line x1="525" y1="158" x2="675" y2="158" stroke="#16a34a" stroke-width="0.5"/>
    <text x="600" y="175" text-anchor="middle" font-size="10" font-weight="400" fill="#14532d">CLAUDE.md · Skill ·</text>
    <text x="600" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#14532d">subagent · MCP search</text>
    <text x="600" y="208" text-anchor="middle" font-size="9" font-weight="400" font-style="italic" fill="#14532d">"컨텍스트는 공짜가 아니다"</text>

    <line x1="700" y1="160" x2="735" y2="160" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr2)"/>

    <!-- 4. 권한 샌드박스 -->
    <rect x="735" y="100" width="200" height="120" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="835" y="125" text-anchor="middle" font-size="14" fill="#7f1d1d">④ 권한 샌드박스</text>
    <text x="835" y="148" text-anchor="middle" font-size="11" fill="#7f1d1d">Permission Sandbox</text>
    <line x1="760" y1="158" x2="910" y2="158" stroke="#dc2626" stroke-width="0.5"/>
    <text x="835" y="175" text-anchor="middle" font-size="10" font-weight="400" fill="#7f1d1d">deny 화이트리스트 ·</text>
    <text x="835" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#7f1d1d">worktree · secret 차단</text>
    <text x="835" y="208" text-anchor="middle" font-size="9" font-weight="400" font-style="italic" fill="#7f1d1d">"없으면 사고도 자동화"</text>

    <line x1="935" y1="160" x2="970" y2="160" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr2)"/>

    <!-- 5. 실행 루프 -->
    <rect x="970" y="100" width="200" height="120" rx="12" fill="#fae8ff" stroke="#a21caf" stroke-width="2.5"/>
    <text x="1070" y="125" text-anchor="middle" font-size="14" fill="#581c87">⑤ 실행 루프</text>
    <text x="1070" y="148" text-anchor="middle" font-size="11" fill="#581c87">Execution Loop</text>
    <line x1="995" y1="158" x2="1145" y2="158" stroke="#a21caf" stroke-width="0.5"/>
    <text x="1070" y="175" text-anchor="middle" font-size="10" font-weight="400" fill="#581c87">계획 → 구현 →</text>
    <text x="1070" y="190" text-anchor="middle" font-size="10" font-weight="400" fill="#581c87">검증 → 실패 재시도</text>
    <text x="1070" y="208" text-anchor="middle" font-size="9" font-weight="400" font-style="italic" fill="#581c87">"사람 대신 도는 핵심"</text>
  </g>

  <!-- Down arrow from 5 -->
  <line x1="1070" y1="220" x2="1070" y2="270" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="1095" y="248" font-size="11" font-style="italic" fill="#0ea5e9">통과 시</text>

  <!-- Row 2: 6,7,8,9 (right to left) -->
  <g font-size="12" font-weight="700">
    <!-- 6. 검증 게이트 -->
    <rect x="970" y="270" width="200" height="120" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
    <text x="1070" y="295" text-anchor="middle" font-size="14" fill="#831843">⑥ 검증 게이트</text>
    <text x="1070" y="318" text-anchor="middle" font-size="11" fill="#831843">Verification Gate</text>
    <line x1="995" y1="328" x2="1145" y2="328" stroke="#db2777" stroke-width="0.5"/>
    <text x="1070" y="345" text-anchor="middle" font-size="10" font-weight="400" fill="#831843">test · lint · build ·</text>
    <text x="1070" y="360" text-anchor="middle" font-size="10" font-weight="400" fill="#831843">screenshot · PR review</text>
    <text x="1070" y="378" text-anchor="middle" font-size="9" font-weight="400" font-style="italic" fill="#831843">"잘 된 것 같아요 ≠ 통과"</text>

    <line x1="970" y1="330" x2="935" y2="330" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr2)"/>

    <!-- 7. 독립 리뷰어 -->
    <rect x="735" y="270" width="200" height="120" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="835" y="295" text-anchor="middle" font-size="14" fill="#312e81">⑦ 독립 리뷰어</text>
    <text x="835" y="318" text-anchor="middle" font-size="11" fill="#312e81">Independent Reviewer</text>
    <line x1="760" y1="328" x2="910" y2="328" stroke="#4f46e5" stroke-width="0.5"/>
    <text x="835" y="345" text-anchor="middle" font-size="10" font-weight="400" fill="#312e81">fresh context로 검수</text>
    <text x="835" y="360" text-anchor="middle" font-size="10" font-weight="400" fill="#312e81">spec/quality/regression</text>
    <text x="835" y="378" text-anchor="middle" font-size="9" font-weight="400" font-style="italic" fill="#312e81">"자기 평가는 관대해진다"</text>

    <line x1="735" y1="330" x2="700" y2="330" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr2)"/>

    <!-- 8. 증거 저장소 -->
    <rect x="500" y="270" width="200" height="120" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
    <text x="600" y="295" text-anchor="middle" font-size="14" fill="#164e63">⑧ 증거 저장소</text>
    <text x="600" y="318" text-anchor="middle" font-size="11" fill="#164e63">Evidence Trail</text>
    <line x1="525" y1="328" x2="675" y2="328" stroke="#0891b2" stroke-width="0.5"/>
    <text x="600" y="345" text-anchor="middle" font-size="10" font-weight="400" fill="#164e63">명령·결과·diff·PR·</text>
    <text x="600" y="360" text-anchor="middle" font-size="10" font-weight="400" fill="#164e63">로그·스크린샷 (Obsidian)</text>
    <text x="600" y="378" text-anchor="middle" font-size="9" font-weight="400" font-style="italic" fill="#164e63">"'했어요'는 증거 아님"</text>

    <line x1="500" y1="330" x2="465" y2="330" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arr2)"/>

    <!-- 9. 사람 알림 -->
    <rect x="265" y="270" width="200" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="365" y="295" text-anchor="middle" font-size="14" fill="#7c2d12">⑨ 사람 알림</text>
    <text x="365" y="318" text-anchor="middle" font-size="11" fill="#7c2d12">Human-in-the-loop</text>
    <line x1="290" y1="328" x2="440" y2="328" stroke="#ea580c" stroke-width="0.5"/>
    <text x="365" y="345" text-anchor="middle" font-size="10" font-weight="400" fill="#7c2d12">승인·실패3회·scope변·</text>
    <text x="365" y="360" text-anchor="middle" font-size="10" font-weight="400" fill="#7c2d12">위험명령·merge직전</text>
    <text x="365" y="378" text-anchor="middle" font-size="9" font-weight="400" font-style="italic" fill="#7c2d12">"꼭 봐야 할 것만 알림"</text>
  </g>

  <!-- Failure loop back -->
  <path d="M 1170 330 L 1185 330 L 1185 160 L 1170 160" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr3)"/>
  <text x="1145" y="240" font-size="10" font-style="italic" fill="#dc2626" text-anchor="middle">실패 시</text>
  <text x="1145" y="255" font-size="10" font-style="italic" fill="#dc2626" text-anchor="middle">자동 재시도</text>

  <!-- Bottom summary -->
  <g>
    <rect x="100" y="430" width="1000" height="70" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="600" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">한 줄 요약</text>
    <text x="600" y="483" text-anchor="middle" font-size="12" fill="#0f172a">"큐가 일을 받고 → 분해해서 → 컨텍스트 깔고 → 안전망 안에서 → 루프 돌리고 → 게이트로 검증하고 → 독립 리뷰 받고 → 증거 남기고 → 사람한테 꼭 봐야 할 것만 알림"</text>
  </g>
</svg>
