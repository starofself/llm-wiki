    <text x="845" y="512" font-size="10" fill="#e9d5ff">새 카드 자동 생성:</text>
    <text x="845" y="528" font-size="10" fill="#e9d5ff">  📥 POSCO-PRECURSOR-001</text>
    <text x="845" y="544" font-size="10" fill="#e9d5ff">  → 인니 합작 PT-IBN, MSP</text>
    <text x="845" y="560" font-size="10" fill="#e9d5ff">  → C&amp;P신소재 지분율 추적</text>
    <text x="845" y="576" font-size="10" fill="#e9d5ff">  → 한국 4사 잠재 영향</text>
    <text x="845" y="595" font-size="10" font-weight="700" fill="#fbbf24">⏳ 한 단계 더 깊이 진입</text>
    <text x="845" y="612" font-size="9" fill="#c4b5fd">루프가 다시 돕니다 →</text>
    <text x="1098" y="635" text-anchor="end" font-size="9" fill="#94a3b8">19:31</text>
