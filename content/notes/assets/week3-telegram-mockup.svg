  <text x="600" y="715" text-anchor="middle" font-size="11" fill="#fbbf24" font-weight="700">사용자 입력 = "한 마디" / 봇 출력 = "여러 카드 완료" / 그리고 새 질문 = "한 단계 더 깊이"</text>
